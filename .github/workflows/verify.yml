name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.lock pytest==9.2.0
      - run: python -m pip check
      - run: python -m pytest -q
      - run: python -m compileall -q app
      - run: python security/2026-11-10/test_release.py
